# NodePool for APPLICATION workloads.
#
# This is where the demo service (and anything not system-critical) runs.
# Karpenter picks the cheapest instance that fits the pending pods from a broad
# set of modern families, prefers Spot, and consolidates aggressively to keep
# cost and node count low when traffic drops.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: app
spec:
  template:
    metadata:
      labels:
        workload: app
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default

      # Broad instance choice => better bin-packing and Spot availability.
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"] # prefer spot; fall back to on-demand
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["c", "m", "r"]
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["5"] # modern generations only
        - key: karpenter.k8s.aws/instance-cpu
          operator: In
          values: ["2", "4", "8"]

      # Let nodes be recycled for consolidation / drift after at most 7 days.
      expireAfter: 168h
      terminationGracePeriod: 1m

  # Continuously repack and remove underutilized/empty nodes.
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m

  # Upper bound so a runaway HPA can't provision unbounded capacity.
  limits:
    cpu: "200"
    memory: 400Gi

  weight: 10
