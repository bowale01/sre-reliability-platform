# Default values for demo-service.
# ArgoCD renders this chart; CI bumps image.tag on each release (GitOps).

image:
  repository: REPLACE_WITH_ECR_URL
  tag: latest
  pullPolicy: IfNotPresent

# Number of stable replicas (HPA may scale beyond this).
replicaCount: 3

env: prod
version: "1.0.0"

# Tunable SLI signal injection (keeps the demo's SLOs moving).
faultInjection: "0.01"
latencySlowRatio: "0.05"
latencySlowMs: "400"

service:
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /readyz
    alb.ingress.kubernetes.io/healthcheck-port: traffic-port
    alb.ingress.kubernetes.io/success-codes: "200"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 60

pdb:
  enabled: true
  minAvailable: 2

# --- Progressive delivery ---------------------------------------------------
# When enabled, the workload is an Argo Rollouts "Rollout" with an SLO-gated
# canary. When disabled, it falls back to a plain Deployment.
rollout:
  enabled: true
  canary:
    # Traffic steps; between each the AnalysisTemplate checks the SLIs.
    steps:
      - setWeight: 5
      - pause: { duration: 2m }
      - setWeight: 25
      - pause: { duration: 2m }
      - setWeight: 50
      - pause: { duration: 2m }
      - setWeight: 100
    analysis:
      # Datadog AnalysisTemplate that aborts the canary on SLI breach.
      enabled: true
      templateName: demo-service-slo

datadog:
  env: prod
  service: demo-service
  version: "1.0.0"
